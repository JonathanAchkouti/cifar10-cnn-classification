run_name: 'resnet9_50ep'

model:
  name: 'resnet9'          # 'simplenet' or 'resnet9'

data:
  val_split: 0.1
  augment: true            # random crop + horizontal flip
  cutout: true             # random erasing, applied after normalization
  num_workers: 2           # Colab VMs only have 2 vCPUs
  root: 'data/cifar10'

hyperparameters:
  epochs: 50
  batch_size: 512
  max_lr: 0.4              # peak of the one-cycle schedule
  momentum: 0.9
  weight_decay: 0.0005
  label_smoothing: 0.1
  seed: 42

eval:
  tta: true                # average logits over image + horizontal flip

paths:
  model_path: 'weights/checkpoint.pth'
  results_path: 'results.csv'